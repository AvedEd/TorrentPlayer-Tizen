<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TorrentPlayer & IPTV</title>
    <link rel="stylesheet" href="css/player.css">
</head>
<body>
    <!-- HOME SCREEN -->
    <section id="homeScreen" class="screen home-screen">
        <div class="home-container">
            <div class="logo"><div class="logo-icon">▶</div><div class="logo-text">TorrentPlayer Pro</div></div>
            <div class="subtitle">Торренты и IPTV для Samsung Smart TV</div>
            <div class="url-container">
                <input id="streamUrl" type="text" placeholder="URL видеопотока или .m3u плейлиста" autocomplete="off">
                <div style="display:flex; gap:10px;">
                    <button id="playButton" type="button" style="flex:1;">▶ Торрент/Поток</button>
                    <button id="loadIptvBtn" type="button" style="flex:1; background:#27ae60;">📺 Загрузить IPTV</button>
                </div>
            </div>
            <div class="hint">Вставьте ссылку на поток или IPTV-плейлист (.m3u)</div>
        </div>
    </section>

    <!-- PLAYER SCREEN -->
    <section id="playerScreen" class="screen player-screen hidden">
        <div id="videoSurface" class="video-surface"></div>
        
        <!-- Правая шторка серий торрента -->
        <div id="playlistSidebar" class="playlist-sidebar hidden">
            <div class="sidebar-title">Выбор серии</div>
            <div id="seriesListContainer" class="sidebar-list"></div>
        </div>

        <!-- ЛЕВАЯ ШТОРКА IPTV КАНАЛОВ (Кнопка ВЛЕВО) -->
        <div id="iptvSidebar" class="iptv-sidebar hidden">
            <div class="sidebar-title">📺 Список каналов</div>
            <div id="iptvListContainer" class="sidebar-list"></div>
        </div>

        <!-- НИЖНЕЕ МЕГА-МЕНЮ (Кнопка ВНИЗ) -->
        <div id="bottomSettingsMenu" class="bottom-menu-panel hidden">
            <div class="menu-progress-section">
                <div class="progress-container"><div id="menuProgress" class="progress"></div></div>
                <div class="time-row"><span id="menuCurrentTime">00:00</span><span id="menuDuration">00:00</span></div>
            </div>
            <div class="menu-row-section">
                <div class="row-title">Аудиодорожки (Озвучка)</div>
                <div id="menuAudioTracks" class="horizontal-row"></div>
            </div>
            <div class="menu-row-section">
                <div class="row-title">Субтитры</div>
                <div id="menuSubtitles" class="horizontal-row"></div>
            </div>
            <div class="menu-row-section">
                <div class="row-title">Буфер предзагрузки (Кэш TorServe)</div>
                <div id="menuBufferSettings" class="horizontal-row"></div>
            </div>
            <div class="menu-row-section">
                <div id="seriesPlaylistRow" class="horizontal-row">
                    <button id="openPlaylistBtn" class="track-item playlist-trigger-btn" type="button">📂 Список серий (Торрент)</button>
                </div>
            </div>
        </div>

        <!-- Виджет буфера в правом верхнем углу (Кнопка ВВЕРХ) -->
        <div id="topBufferInfo" class="top-buffer-widget hidden">
            <div class="widget-title">Статус TorServe</div>
            <div id="bufferMegaBytes" class="widget-value">Загружено: 0 МБ</div>
            <div id="bufferSpeed" class="widget-sub">Скорость: 0 МБ/с</div>
        </div>
    </section>

    <!-- ОВЕРЛЕИ ЗАГРУЗКИ -->
    <div id="loading" class="overlay hidden"><div class="loading-box"><div class="spinner"></div><div id="loadingText" class="loading-text">Загрузка...</div></div></div>

    <!-- СКРИПТЫ -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/avplay.js"></script>
    <script src="js/tracks.js"></script>
    <script src="js/remote.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
