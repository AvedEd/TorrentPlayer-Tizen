<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>TorrentPlayer</title>


    <!-- ========================= -->
    <!-- Основной стиль             -->
    <!-- ========================= -->

    <link
        rel="stylesheet"
        href="css/player.css"
    >


</head>


<body>


    <!-- ================================================= -->
    <!-- HOME                                               -->
    <!-- ================================================= -->

    <section
        id="homeScreen"
        class="screen home-screen"
    >

        <div class="home-container">


            <div class="logo">

                <div class="logo-icon">
                    ▶
                </div>

                <div class="logo-text">
                    TorrentPlayer
                </div>

            </div>


            <div class="subtitle">
                Плеер для Samsung Smart TV
            </div>


            <div class="url-container">

                <input
                    id="streamUrl"
                    type="text"
                    placeholder="URL videoпотока"
                    autocomplete="off"
                >


                <button
                    id="playButton"
                    type="button"
                >
                    ▶ Воспроизвести
                </button>

            </div>


            <div class="hint">

                Введите адрес видеопотока
                и нажмите OK

            </div>


            <button
                id="updateButton"
                type="button"
                class="secondary-button"
            >
                Проверить обновления
            </button>


        </div>

    </section>



    <!-- ================================================= -->
    <!-- PLAYER                                             -->
    <!-- ================================================= -->

    <section
        id="playerScreen"
        class="screen player-screen hidden"
    >


        <!-- Видео выводится AVPlay -->

        <div
            id="videoSurface"
            class="video-surface"
        >
        </div>


        <!-- =============================== -->
        <!-- HUD                             -->
        <!-- =============================== -->

        <div
            id="playerHud"
            class="player-hud hidden"
        >


            <div class="top-bar">

                <div
                    id="playerTitle"
                    class="player-title"
                >
                    TorrentPlayer
                </div>


                <div
                    id="bufferStatus"
                    class="buffer-status"
                >
                </div>

            </div>



            <div class="bottom-panel">


                <div class="progress-container">

                    <div
                        id="progress"
                        class="progress"
                    >
                    </div>

                </div>


                <div class="time-row">


                    <span
                        id="currentTime"
                    >
                        00:00
                    </span>


                    <span
                        id="duration"
                    >
                        00:00
                    </span>


                </div>


                <div class="controls">


                    <button
                        id="rewindButton"
                        type="button"
                    >
                        ↶ 10
                    </button>


                    <button
                        id="playPauseButton"
                        type="button"
                    >
                        ▶
                    </button>


                    <button
                        id="forwardButton"
                        type="button"
                    >
                        10 ↷
                    </button>


                    <button
                        id="muteButton"
                        type="button"
                    >
                        🔊
                    </button>


                </div>


            </div>


        </div>


        <!-- ================================================= -->
        <!-- BOTTOM SETTINGS MENU (Выезжает по кнопке ВНИЗ)    -->
        <!-- ================================================= -->

        <div
            id="bottomSettingsMenu"
            class="bottom-menu-panel hidden"
        >


            <!-- 1. Ползунок времени фильма -->

            <div class="menu-progress-section">


                <div class="progress-container">

                    <div
                        id="menuProgress"
                        class="progress"
                    >
                    </div>

                </div>


                <div class="time-row">


                    <span
                        id="menuCurrentTime"
                    >
                        00:00
                    </span>


                    <span
                        id="menuDuration"
                    >
                        00:00
                    </span>


                </div>


            </div>


            <!-- 2. Горизонтальный ряд: Озвучки -->

            <div class="menu-row-section">


                <div class="row-title">
                    Аудиодорожки (Озвучка)
                </div>


                <div
                    id="menuAudioTracks"
                    class="horizontal-row"
                >
                    <!-- JS добавит плитки студий сюда -->
                </div>


            </div>


            <!-- 3. Горизонтальный ряд: Субтитры -->

            <div class="menu-row-section">


                <div class="row-title">
                    Субтитры
                </div>


                <div
                    id="menuSubtitles"
                    class="horizontal-row"
                >
                    <!-- JS добавит плитки субтитров сюда -->
                </div>


            </div>


            <!-- 4. Кнопка открытия плейлиста серий -->

            <div class="menu-row-section">


                <div
                    id="seriesPlaylistRow"
                    class="horizontal-row"
                >

                    <button
                        id="openPlaylistBtn"
                        class="track-item playlist-trigger-btn"
                        type="button"
                    >
                        📂 Список серий (Плейлист)
                    </button>

                </div>


            </div>


            <!-- 5. Выезжающая справа шторка списка серий -->

            <div
                id="playlistSidebar"
                class="playlist-sidebar hidden"
            >


                <div class="sidebar-title">
                    Выбор серии
                </div>


                <div
                    id="seriesListContainer"
                    class="sidebar-list"
                >
                    <!-- JS добавит серии сюда -->
                </div>


            </div>


        </div>


    </section>



    <!-- ================================================= -->
    <!-- SETTINGS                                          -->
    <!-- ================================================= -->

    <section
        id="settingsScreen"
        class="screen settings-screen hidden"
    >

        <div class="settings-container">

            <h1>
                Настройки
            </h1>


            <button
                id="settingsBackButton"
                type="button"
            >
                ← Назад
            </button>

        </div>

    </section>



    <!-- ================================================= -->
    <!-- LOADING                                           -->
    <!-- ================================================= -->

    <div
        id="loading"
        class="overlay hidden"
    >

        <div class="loading-box">

            <div class="spinner">
            </div>


            <div
                id="loadingText"
                class="loading-text"
            >
                Загрузка...
            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- ERROR                                             -->
    <!-- ================================================= -->

    <div
        id="errorDialog"
        class="overlay hidden"
    >

        <div class="dialog">

            <h2>
                Ошибка
            </h2>


            <div
                id="errorMessage"
                class="error-message"
            >
            </div>


            <div class="dialog-buttons">


                <button
                    id="retryButton"
                    type="button"
                >
                    Повторить
                </button>


                <button
                    id="backButton"
                    type="button"
                >
                    Назад
                </button>


            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- Tizen Web API                                     -->
    <!-- ================================================= -->

    <script
        src="$WEBAPIS/webapis/webapis.js"
    >
    </script>



    <!-- ================================================= -->
    <!-- TorrentPlayer modules                             -->
    <!-- ================================================= -->

    <script
        src="js/storage.js"
    >
    </script>
